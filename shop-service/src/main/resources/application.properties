spring.application.name=shop-service
server.port=8200

spring.datasource.url=jdbc:mysql://localhost:3306/online_store
spring.datasource.username=ecommerce-user
spring.datasource.password=dummypassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.config.import=optional:configserver:http://localhost:8888
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

resilience4j.retry.instances.inventory-service.max-attempts=3
resilience4j.retry.instances.inventory-service.wait-duration=1s
resilience4j.retry.instances.wallet-service.max-attempts=3
resilience4j.retry.instances.wallet-service.wait-duration=1s

resilience4j.circuitbreaker.instances.inventory-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventory-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.wallet-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.wallet-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.wallet-service.wait-duration-in-open-state=10s


